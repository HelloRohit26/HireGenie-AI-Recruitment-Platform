<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_18 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_18" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_18');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Create the Central Voice Visualization (Rings)
const ringCount = 8;
const rings = [];
const ringGroup = new THREE.Group();

for (let i = 0; i < ringCount; i++) {
  const radius = 1.2 + (i * 0.15);
  const segments = 128;
  const geometry = new THREE.TorusGeometry(radius, 0.005, 16, segments);
  const material = new THREE.MeshBasicMaterial({ 
    color: 0xd6a85f, 
    transparent: true, 
    opacity: 0.1 - (i * 0.01) 
  });
  const ring = new THREE.Mesh(geometry, material);
  ringGroup.add(ring);
  rings.push({
    mesh: ring,
    originalScale: 1.0,
    speed: 0.5 + Math.random() * 0.5
  });
}
scene.add(ringGroup);

// Create the Abstract Core
const coreGeom = new THREE.IcosahedronGeometry(0.8, 1);
const coreMat = new THREE.MeshPhongMaterial({
  color: 0xd6a85f,
  wireframe: true,
  transparent: true,
  opacity: 0.15
});
const core = new THREE.Mesh(coreGeom, coreMat);
scene.add(core);

const light = new THREE.PointLight(0xd6a85f, 1, 10);
light.position.set(0, 0, 2);
scene.add(light);

// Animation Loop
function animate(time) {
  const t = time * 0.001;
  
  // Rotate core
  core.rotation.x = t * 0.2;
  core.rotation.y = t * 0.3;
  
  // Subtle ring breathing
  rings.forEach((r, i) => {
    const scale = 1.0 + Math.sin(t * r.speed + i) * 0.05;
    r.mesh.scale.set(scale, scale, 1);
    r.mesh.rotation.z = t * (0.1 + i * 0.02);
  });
  
  // Subtle camera parallax based on mouse (logic would go here if window listener added)
  
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

animate(0);
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_18 -->
</body>
</html>
