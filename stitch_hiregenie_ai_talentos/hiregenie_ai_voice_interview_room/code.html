<canvas id="shader-canvas-ANIMATION_17" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_17');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;

// Simulates a cinematic "Voice Field" with organic volumetric depth
// Colors derived from HireGenie palette: Graphite (#131311), Muted Brass (#d6a85f)

float noise(vec2 p) {
    return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
}

void main() {
    vec2 uv = v_texCoord;
    vec2 center = vec2(0.5, 0.5);
    float dist = distance(uv, center);
    
    // Background colors
    vec3 colorBg = vec3(0.075, 0.075, 0.067); // Surface Graphite
    vec3 colorDeep = vec3(0.04, 0.04, 0.035);  // Deeper Graphite
    
    // Subtle flowing noise for volumetric feel
    float n = noise(uv * 2.0 + u_time * 0.05);
    n += noise(uv * 4.0 - u_time * 0.03) * 0.5;
    
    // Vignette/Depth effect
    float vignette = smoothstep(0.8, 0.2, dist);
    vec3 finalColor = mix(colorDeep, colorBg, vignette + n * 0.05);
    
    // Subtle ambient glow from the "Core"
    float glow = 0.02 / (dist + 0.1);
    vec3 accent = vec3(0.839, 0.659, 0.373); // Muted Brass
    finalColor += accent * glow * 0.2;
    
    // Interactive mouse parallax (subtle)
    vec2 mouse = u_mouse / u_resolution;
    float mouseDist = distance(uv, mouse);
    finalColor += accent * (0.01 / (mouseDist + 0.5)) * 0.1;
    
    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<div class="absolute inset-0 w-full h-full" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_18" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_18');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Create the Central Voice Visualization (Rings)
const ringCount = 8;
const rings = [];
const ringGroup = new THREE.Group();

for (let i = 0; i < ringCount; i++) {
  const radius = 1.2 + (i * 0.15);
  const segments = 128;
  const geometry = new THREE.TorusGeometry(radius, 0.005, 16, segments);
  const material = new THREE.MeshBasicMaterial({ 
    color: 0xd6a85f, 
    transparent: true, 
    opacity: 0.1 - (i * 0.01) 
  });
  const ring = new THREE.Mesh(geometry, material);
  ringGroup.add(ring);
  rings.push({
    mesh: ring,
    originalScale: 1.0,
    speed: 0.5 + Math.random() * 0.5
  });
}
scene.add(ringGroup);

// Create the Abstract Core
const coreGeom = new THREE.IcosahedronGeometry(0.8, 1);
const coreMat = new THREE.MeshPhongMaterial({
  color: 0xd6a85f,
  wireframe: true,
  transparent: true,
  opacity: 0.15
});
const core = new THREE.Mesh(coreGeom, coreMat);
scene.add(core);

const light = new THREE.PointLight(0xd6a85f, 1, 10);
light.position.set(0, 0, 2);
scene.add(light);

// Animation Loop
function animate(time) {
  const t = time * 0.001;
  
  // Rotate core
  core.rotation.x = t * 0.2;
  core.rotation.y = t * 0.3;
  
  // Subtle ring breathing
  rings.forEach((r, i) => {
    const scale = 1.0 + Math.sin(t * r.speed + i) * 0.05;
    r.mesh.scale.set(scale, scale, 1);
    r.mesh.rotation.z = t * (0.1 + i * 0.02);
  });
  
  // Subtle camera parallax based on mouse (logic would go here if window listener added)
  
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

animate(0);
})();
</script>
