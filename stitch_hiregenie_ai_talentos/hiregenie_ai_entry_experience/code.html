<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>HireGenie AI - Intelligent Hiring Infrastructure</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#4f4538",
                        "on-error": "#690005",
                        "on-secondary": "#382f23",
                        "inverse-primary": "#7c5816",
                        "on-tertiary-fixed": "#001c38",
                        "outline-variant": "#4f4538",
                        "surface-container-high": "#2a2a28",
                        "tertiary": "#aaceff",
                        "on-secondary-container": "#c1b3a2",
                        "primary-container": "#d6a85f",
                        "on-tertiary": "#02315a",
                        "secondary-fixed-dim": "#d3c4b3",
                        "success-muted": "#2d3528",
                        "error-container": "#93000a",
                        "outline": "#4f4538",
                        "secondary-fixed": "#f0e0ce",
                        "on-tertiary-fixed-variant": "#234872",
                        "on-surface": "#e3e2df",
                        "on-tertiary-container": "#1e446e",
                        "surface-tint": "#efbf73",
                        "on-primary": "#432c00",
                        "surface-container-highest": "#353532",
                        "surface-container-low": "#1c1c19",
                        "background": "#131311",
                        "inverse-surface": "#e5e2de",
                        "on-primary-fixed-variant": "#604100",
                        "on-error-container": "#ffdad6",
                        "secondary": "#d3c4b3",
                        "primary": "#f4c377",
                        "tertiary-container": "#8fb2e2",
                        "surface-variant": "#353532",
                        "primary-fixed": "#ffdeae",
                        "tertiary-fixed-dim": "#a6c9fa",
                        "error": "#ffb4ab",
                        "primary-fixed-dim": "#efbf73",
                        "surface-container": "#20201d",
                        "inverse-on-surface": "#31302e",
                        "surface": "#131311",
                        "on-primary-container": "#5b3d00",
                        "on-background": "#e5e2de",
                        "on-primary-fixed": "#281800",
                        "tertiary-fixed": "#d3e4ff",
                        "surface-bright": "#3a3937",
                        "on-surface-variant": "#d2c4b3",
                        "on-secondary-fixed-variant": "#4f4538",
                        "surface-dim": "#131311",
                        "accent-lume": "#f2dec0",
                        "on-secondary-fixed": "#221a0f",
                        "surface-container-lowest": "#0e0e0c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "unit": "8px",
                        "container-max": "1200px",
                        "onboarding-track-height": "4px",
                        "gutter": "24px",
                        "margin-mobile": "20px",
                        "margin-desktop": "64px"
                    },
                    "fontFamily": {
                        "title-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "label-md": ["Hanken Grotesk"],
                        "label-sm": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600" }],

                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-surface');
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle ambient glow for the entry experience */
        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            max-width: 800px;
            max-height: 800px;
            background: radial-gradient(circle, rgba(244, 195, 119, 0.05) 0%, rgba(19, 19, 17, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Role Selection Card Interactions */
        .role-card {
            transition: all 0.3s ease;
            border: 1px solid theme('colors.outline');
            background-color: theme('colors.surface-container-low');
        }

        .role-card:hover {
            border-color: theme('colors.primary');
            background-color: rgba(244, 195, 119, 0.03); /* Subtle primary tint */
            transform: translateY(-2px);
        }

        .role-card:hover .role-icon {
            color: theme('colors.primary');
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="font-body-md text-body-md antialiased">
<!-- Ambient Background -->
<div class="ambient-glow"></div>
<!-- Main Content Container -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile relative z-10 py-16 md:py-24">
<div class="w-full max-w-[480px] flex flex-col items-center text-center">
<!-- Logo & Branding -->
<div class="mb-12 flex flex-col items-center">
<div class="w-16 h-16 rounded-xl bg-surface-container flex items-center justify-center border border-outline mb-6">
<span class="material-symbols-outlined text-primary text-3xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">temp_preferences_custom</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface mb-4">HireGenie AI</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[320px]">
                    Intelligent hiring infrastructure.
                </p>
</div>
<!-- Role Selection -->
<div class="w-full flex flex-col gap-unit mb-12">
<button class="role-card w-full text-left p-6 rounded-xl flex items-start gap-4 group">
<div class="mt-1">
<span class="material-symbols-outlined role-icon text-on-surface-variant transition-colors duration-300">work</span>
</div>
<div>
<h2 class="font-title-md text-title-md text-on-surface mb-1 group-hover:text-primary transition-colors duration-300">I'm Hiring</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Build your team with AI-driven insights and streamlined workflows.</p>
</div>
</button>
<button class="role-card w-full text-left p-6 rounded-xl flex items-start gap-4 group">
<div class="mt-1">
<span class="material-symbols-outlined role-icon text-on-surface-variant transition-colors duration-300">person_search</span>
</div>
<div>
<h2 class="font-title-md text-title-md text-on-surface mb-1 group-hover:text-primary transition-colors duration-300">I'm Looking for a Job</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Discover opportunities matched to your unique skills and trajectory.</p>
</div>
</button>
</div>
<!-- Sign In Link -->
<div class="mt-auto">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors ml-1" href="#">Sign In</a>
</p>
</div>
</div>
</main>
</body></html>
