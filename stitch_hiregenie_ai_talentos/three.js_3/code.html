<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_40 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_40" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_40');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const container = document.getElementById('threejs-container-ANIMATION_41');
  if (!container) return;
  
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  camera.position.z = 8;

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  // Colors from HireGenie Palette
  const accentColor = 0xd6a85f; // Muted Brass
  const nodeColor = 0x383938;   // Surface Bright
  const secondaryColor = 0x9b8f7f; // Outline

  const group = new THREE.Group();
  scene.add(group);

  // Create Central Candidate Node
  const centralGeom = new THREE.SphereGeometry(0.4, 32, 32);
  const centralMat = new THREE.MeshPhongMaterial({ color: accentColor, emissive: accentColor, emissiveIntensity: 0.5 });
  const centralNode = new THREE.Mesh(centralGeom, centralMat);
  group.add(centralNode);

  // Skill & Signal Nodes
  const nodes = [];
  const connectionMaterial = new THREE.LineBasicMaterial({ color: accentColor, transparent: true, opacity: 0.2 });

  const categories = [
    { name: 'Skills', count: 8, radius: 4, color: accentColor },
    { name: 'Projects', count: 4, radius: 6, color: secondaryColor },
    { name: 'Experience', count: 3, radius: 5, color: nodeColor }
  ];

  categories.forEach((cat, cIdx) => {
    for (let i = 0; i < cat.count; i++) {
      const angle = (i / cat.count) * Math.PI * 2 + (cIdx * 0.5);
      const x = Math.cos(angle) * cat.radius;
      const y = Math.sin(angle) * cat.radius;
      const z = (Math.random() - 0.5) * 2;

      const geom = new THREE.SphereGeometry(0.12, 16, 16);
      const mat = new THREE.MeshPhongMaterial({ color: cat.color });
      const node = new THREE.Mesh(geom, mat);
      node.position.set(x, y, z);
      
      node.userData = {
        origin: node.position.clone(),
        offset: Math.random() * Math.PI * 2
      };

      group.add(node);
      nodes.push(node);

      // Lines to center
      const points = [new THREE.Vector3(0,0,0), node.position];
      const lineGeom = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(lineGeom, connectionMaterial);
      group.add(line);
    }
  });

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambientLight);

  const pointLight = new THREE.PointLight(accentColor, 1, 20);
  pointLight.position.set(5, 5, 5);
  scene.add(pointLight);

  // Interaction Logic (Subtle Mouse Parallax)
  let mouseX = 0, mouseY = 0;
  window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX - window.innerWidth / 2) * 0.01;
    mouseY = (e.clientY - window.innerHeight / 2) * 0.01;
  });

  function animate(time) {
    const t = time * 0.001;
    
    nodes.forEach(node => {
      node.position.y = node.userData.origin.y + Math.sin(t + node.userData.offset) * 0.15;
      node.position.x = node.userData.origin.x + Math.cos(t * 0.8 + node.userData.offset) * 0.1;
    });

    group.rotation.y += (mouseX - group.rotation.y) * 0.05;
    group.rotation.x += (mouseY - group.rotation.x) * 0.05;

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  animate(0);
})();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_40 -->


</body></html>
